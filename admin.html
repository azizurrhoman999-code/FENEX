<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | FENEX</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Dark Theme */
    :root {
      --bg-color: #f4f6f9;
      --text-color: #111;
      --card-bg: #ffffff;
      --border-color: #eee;
      --accent-color: #000;
    }
    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f4f6f9;
      --card-bg: #1e1e1e;
      --border-color: #333333;
      --accent-color: #ffffff;
    }

    body { background: var(--bg-color); color: var(--text-color); margin: 0; font-family: 'Montserrat', sans-serif; transition: background 0.3s, color 0.3s; }
    .admin-container { max-width: 1200px; margin: 20px auto; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 4px; font-weight: 700; font-size: 0.82rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--card-bg); color: var(--text-color); font-size: 0.88rem; font-family: inherit; box-sizing: border-box; }
    .btn-admin { padding: 10px 18px; background: var(--accent-color); color: var(--bg-color); border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .btn-danger { background: #d90429; color: #fff; }
    .btn-success { background: #2e7d32; color: #fff; }
    .grid-admin { display: grid; grid-template-columns: 360px 1fr; gap: 25px; }
    @media (max-width: 900px) { .grid-admin { grid-template-columns: 1fr; } }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid var(--border-color); }
    th, td { padding: 10px; text-align: left; font-size: 0.82rem; }
    th { background-color: var(--accent-color); color: var(--bg-color); }
    .badge-trx { background: rgba(13, 71, 161, 0.1); color: #0d47a1; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
    
    .order-item-box { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px dashed var(--border-color); }
    .order-item-img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); background: #fafafa; }
    .size-badge { color: #d90429; font-weight: 800; background: #ffe3e3; padding: 1px 5px; border-radius: 3px; font-size: 0.72rem; }
    .color-badge { color: #023e8a; font-weight: 700; background: #e0f2fe; padding: 1px 5px; border-radius: 3px; font-size: 0.72rem; }
    
    #loadingState { text-align: center; padding: 50px; font-weight: bold; font-size: 1.2rem; }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <header class="navbar" style="display: flex; justify-content: space-between; padding: 15px 5%; border-bottom: 1px solid var(--border-color);">
    <a href="index.html" class="logo" style="text-decoration: none; color: inherit; font-weight: 800; font-size: 20px;">FENEX <span style="font-size: 12px; font-weight: normal;">(Admin Panel)</span></a>
    <i class="fa-solid fa-moon" id="themeToggleBtn" style="cursor: pointer; font-size: 18px;"></i>
  </header>

  <div id="loadingState">
    <i class="fa-solid fa-spinner fa-spin"></i> সিকিউরিটি ও ডাটা যাচাই করা হচ্ছে...
  </div>

  <div id="adminDashboard" class="admin-container" style="display: none;">
    <div class="admin-header">
      <h2>Dashboard Overview</h2>
      <div>
        <a href="index.html" class="btn-admin" style="text-decoration: none; margin-right: 8px;">View Website</a>
        <button onclick="logoutAdmin()" class="btn-admin btn-danger">Logout</button>
      </div>
    </div>

    <div class="grid-admin">
      <!-- Add New Product Form -->
      <div>
        <div style="background: var(--card-bg); padding: 18px; border-radius: 8px; border: 1px solid var(--border-color);">
          <h3 style="font-size: 1rem; margin-bottom: 15px;"><i class="fa-solid fa-plus"></i> নতুন প্রোডাক্ট যোগ করুন</h3>
          <form id="addProductForm">
            <div class="form-group">
              <label>প্রোডাক্টের নাম</label>
              <input type="text" id="pTitle" required placeholder="Ex: Black Hoodie">
            </div>

            <div class="form-group">
              <label>দাম (৳)</label>
              <input type="number" id="pPrice" required placeholder="1200">
            </div>

            <div class="form-group">
              <label>জেন্ডার</label>
              <select id="pGender">
                <option value="men">Men</option>
                <option value="women">Women</option>
              </select>
            </div>

            <div class="form-group">
              <label>টাইপ</label>
              <select id="pCategory">
                <option value="Shirt">Shirt</option>
                <option value="T-Shirt">T-Shirt</option>
                <option value="Pant">Pant</option>
                <option value="Shoes">Shoes</option>
                <option value="Watch">Watch</option>
                <option value="Sunglass">Sunglass</option>
                <option value="Tops">Tops & Dress</option>
                <option value="Bags">Bags</option>
                <option value="Jewelry">Jewelry</option>
              </select>
            </div>

            <div style="background: rgba(0,0,0,0.03); padding: 12px; border-radius: 6px; margin-bottom: 15px;">
              <div class="form-group">
                <label>ছবি ১ (Main Image) *Required</label>
                <input type="url" id="pImageMain" placeholder="লিংক এখানে পেস্ট করুন..." required>
              </div>

              <div class="form-group">
                <label>ছবি ২ (Optional)</label>
                <input type="url" id="pImage1" placeholder="লিংক এখানে পেস্ট করুন...">
              </div>

              <div class="form-group">
                <label>ছবি ৩ (Optional)</label>
                <input type="url" id="pImage2" placeholder="লিংক এখানে পেস্ট করুন...">
              </div>

              <div class="form-group">
                <label>ছবি ৪ (Optional)</label>
                <input type="url" id="pImage3" placeholder="লিংক এখানে পেস্ট করুন...">
              </div>
            </div>

            <div class="form-group">
              <label>প্রোডাক্ট বিবরণ (Details):</label>
              <textarea id="pDesc" rows="4" placeholder="ফ্যাব্রিক, GSM, প্রিন্ট বা প্রোডাক্টের তথ্য লিখুন..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-admin btn-success" style="width: 100%;">Add Product</button>
          </form>
        </div>

        <div style="margin-top: 20px;">
          <h4 style="margin-bottom: 10px;">অ্যাড করা প্রোডাক্টস</h4>
          <div id="customProductList"></div>
        </div>
      </div>

      <!-- Orders List -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h3 style="font-size: 1.1rem;"><i class="fa-solid fa-cart-shopping"></i> Customer Orders List</h3>
        </div>
        
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer Info</th>
                <th>Ordered Items (Photo, Size, Color)</th>
                <th>Payment</th>
                <th>TrxID</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ১. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA4as297Sk35tTVqSQyOUztD5Vg9sV0Oy8",
      authDomain: "fenex-ba1af.firebaseapp.com",
      databaseURL: "https://fenex-ba1af-default-rtdb.firebaseio.com",
      projectId: "fenex-ba1af",
      storageBucket: "fenex-ba1af.firebasestorage.app",
      messagingSenderId: "506989870286",
      appId: "1:506989870286:web:75b50258542b88b443e49f"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const rtdb = firebase.database();

    // ২. অনুমোদিত অ্যাডমিন জিমেইল
    const ADMIN_EMAIL = "dreamboy50700@gmail.com"; 

    // ৩. সিকিউরিটি চেক
    firebase.auth().onAuthStateChanged((user) => {
      if (user && user.email === ADMIN_EMAIL) {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
        listenToProducts();
        listenToOrders();
      } else {
        alert("অ্যাক্সেস সংরক্ষিত! শুধু অ্যাডমিন সাইন-ইন করতে পারবে।");
        window.location.href = "login.html";
      }
    });

    function logoutAdmin() {
      firebase.auth().signOut().then(() => {
        window.location.href = "login.html";
      });
    }

    // ৪. Firestore-এ নতুন প্রোডাক্ট যোগ করা
    document.getElementById("addProductForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "সংরক্ষণ করা হচ্ছে...";

      const title = document.getElementById("pTitle").value.trim();
      const price = Number(document.getElementById("pPrice").value) || 0;
      const gender = document.getElementById("pGender").value;
      const category = document.getElementById("pCategory").value;

      const mainImg = document.getElementById("pImageMain").value.trim();
      const img1 = document.getElementById("pImage1").value.trim();
      const img2 = document.getElementById("pImage2").value.trim();
      const img3 = document.getElementById("pImage3").value.trim();
      const desc = document.getElementById("pDesc").value.trim();

      const galleryImgs = [mainImg, img1, img2, img3].filter(url => url && url.length > 0);

      const newProduct = {
        name: title,
        title: title,
        price: price,
        gender: gender,
        category: category,
        image: mainImg,
        images: galleryImgs.length > 0 ? galleryImgs : [mainImg],
        desc: desc || "Premium quality luxury streetwear designed for ultimate comfort.",
        description: desc || "Premium quality luxury streetwear designed for ultimate comfort.",
        sizes: ["M", "L", "XL"],
        colors: ["Standard"],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("products").add(newProduct)
        .then(() => {
          alert("প্রোডাক্ট ফায়ারবেসে সফলভাবে যোগ করা হয়েছে!");
          document.getElementById("addProductForm").reset();
        })
        .catch((error) => {
          alert("Error adding product: " + error.message);
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = "Add Product";
        });
    });

    // ৫. রিয়েল-টাইম প্রোডাক্ট লিস্ট প্রদর্শন
    function listenToProducts() {
      db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById("customProductList");
        if (snapshot.empty) {
          container.innerHTML = `<p style="color: #888; padding: 10px;">কোনো প্রোডাক্ট পাওয়া যায়নি।</p>`;
          return;
        }

        container.innerHTML = snapshot.docs.map(doc => {
          const p = doc.data();
          const id = doc.id;
          return `
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); margin-bottom: 8px; border-radius: 6px;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <img src="${p.image}" alt="${p.name || p.title}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px;" onerror="this.src='https://via.placeholder.com/45'">
                <div>
                  <h4 style="margin: 0 0 4px 0; font-size: 0.9rem; color: var(--text-color);">${p.name || p.title}</h4>
                  <span style="font-size: 0.78rem; color: #777;">৳${p.price} | ${p.gender ? p.gender.toUpperCase() : ''} (${p.category})</span>
                </div>
              </div>
              <button onclick="deleteProduct('${id}')" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold;">
                Delete
              </button>
            </div>
          `;
        }).join('');
      });
    }

    // ৬. ফায়ারবেস থেকে প্রোডাক্ট ডিলিট
    function deleteProduct(docId) {
      if (confirm("আপনি কি নিশ্চিত যে এই প্রোডাক্টটি ডিলিট করতে চান?")) {
        db.collection("products").doc(docId).delete().then(() => {
          alert("প্রোডাক্ট ডিলিট করা হয়েছে!");
        });
      }
    }

    // ৭. রিয়েল-টাইম কাস্টমার অর্ডার প্রদর্শন (Firestore + RTDB Sync)
    function listenToOrders() {
      // Firestore listener
      db.collection("orders").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        renderOrdersTable(snapshot.docs.map(doc => ({ docId: doc.id, source: 'firestore', ...doc.data() })));
      }, (err) => {
        console.warn("Firestore order fetch failed, trying Realtime DB", err);
        // Fallback to Realtime Database
        rtdb.ref('orders').on('value', (snap) => {
          const data = snap.val();
          let ordersArr = [];
          if (data) {
            Object.keys(data).forEach(k => {
              ordersArr.push({ docId: k, source: 'rtdb', ...data[k] });
            });
          }
          renderOrdersTable(ordersArr);
        });
      });
    }

    function renderOrdersTable(orders) {
      const tableBody = document.getElementById("ordersTableBody");
      if (!orders || orders.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888;">কোনো অর্ডার নেই।</td></tr>`;
        return;
      }

      tableBody.innerHTML = orders.map(order => {
        const docId = order.docId;

        const itemsDetail = order.items ? order.items.map(i => {
          const imgUrl = i.image || i.img || 'https://via.placeholder.com/45';
          const size = i.size || 'M';
          const color = i.color || 'Standard';
          const qty = i.qty || i.quantity || 1;

          return `
            <div class="order-item-box">
              <img src="${imgUrl}" alt="Product" class="order-item-img" onerror="this.src='https://via.placeholder.com/45'">
              <div>
                <strong style="font-size: 0.8rem; display: block; color: inherit;">${i.name || i.title || 'Product'}</strong>
                <div style="margin-top: 2px;">
                  <span class="size-badge">Size: ${size}</span>
                  <span class="color-badge">Color: ${color}</span>
                  <span style="font-weight: bold; font-size: 0.75rem; color: inherit; margin-left: 3px;">(x${qty})</span>
                </div>
              </div>
            </div>
          `;
        }).join('') : 'N/A';

        const custName = order.name || order.customerName || (order.customer && order.customer.name) || 'N/A';
        const custPhone = order.phone || order.customerPhone || (order.customer && order.customer.phone) || '';
        const custAddress = order.address || order.customerAddress || (order.customer && order.customer.address) || '';
        const total = order.totalAmount || order.totalPrice || order.total || order.price || 0;
        const displayId = order.orderId || docId.substring(0, 8);

        return `
          <tr>
            <td><strong>${displayId}</strong><br><small style="color:#777;">${order.date || ''}</small></td>
            <td><strong>${custName}</strong><br>📞 ${custPhone}<br><small>📍 ${custAddress}</small></td>
            <td style="min-width: 220px;">
              ${itemsDetail}
              <div style="margin-top: 5px;"><strong>Total: ৳${total}</strong></div>
            </td>
            <td>${order.paymentMethod || 'COD'}</td>
            <td><span class="badge-trx">${order.trxId || 'N/A'}</span></td>
            <td>
              <select onchange="updateStatus('${docId}', this.value)" style="padding: 3px; font-size: 0.75rem;">
                <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </td>
            <td><i class="fa-solid fa-trash" onclick="deleteOrder('${docId}')" style="color:red; cursor:pointer;"></i></td>
          </tr>
        `;
      }).join('');
    }

    // ৮. অর্ডারের স্ট্যাটাস আপডেট ও ডিলিট (Firestore + RTDB Synchronized)
    function updateStatus(docId, newStatus) {
      // Update Firestore
      db.collection("orders").doc(docId).update({ status: newStatus }).catch(err => console.log(err));
      // Update Realtime Database
      rtdb.ref('orders/' + docId).update({ status: newStatus }).catch(err => console.log(err));
    }

    function deleteOrder(docId) {
      if (confirm("অর্ডারটি মুছে ফেলতে চান?")) {
        // Delete from Firestore
        db.collection("orders").doc(docId).delete().catch(err => console.log(err));
        // Delete from Realtime Database
        rtdb.ref('orders/' + docId).remove().catch(err => console.log(err));
      }
    }

    // ৯. থিম টগল
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        themeToggleBtn.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
      });
    }
  </script>
</body>
</html>
