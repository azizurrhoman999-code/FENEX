<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | FENEX</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    .thank-you-wrapper {
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .thank-you-card {
      padding: 35px 25px;
      text-align: center;
      border-radius: 12px;
      border: 1px solid var(--border-color, #eee);
      background: var(--card-bg, #fff);
      color: var(--text-color, #111);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .success-icon {
      font-size: 65px;
      color: #2e7d32;
      margin-bottom: 15px;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .order-id-box {
      background: rgba(46, 125, 50, 0.1);
      color: #2e7d32;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0 20px;
      font-size: 0.95rem;
      border: 1px dashed #2e7d32;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: #2e7d32;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 5px;
    }

    /* Summary Card */
    .order-summary {
      text-align: left;
      border-top: 1px solid var(--border-color, #eee);
      padding-top: 20px;
      margin-top: 20px;
    }

    .summary-title {
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: var(--muted-text, #666);
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 1rem;
      font-weight: 800;
      border-top: 1px dashed var(--border-color, #eee);
      padding-top: 10px;
      margin-top: 10px;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-home {
      flex: 1;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: var(--accent-color, #000);
      color: var(--bg-color, #fff);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }

    .btn-outline-action {
      flex: 1;
      min-width: 140px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      background: transparent;
      color: var(--text-color, #111);
      border: 1px solid var(--border-color, #ccc);
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-home:hover, .btn-outline-action:hover {
      opacity: 0.85;
    }

    @media print {
      .navbar, .action-buttons, .copy-btn { display: none !important; }
      .thank-you-card { border: none; box-shadow: none; }
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="navbar" style="justify-content: space-between; padding: 15px 5%;">
    <a href="index.html" class="logo">FENEX</a>
    <i class="fa-solid fa-moon" id="themeToggleBtn" style="cursor: pointer; font-size: 18px;"></i>
  </header>

  <div class="thank-you-wrapper">
    <div class="thank-you-card">
      <i class="fa-solid fa-circle-check success-icon"></i>
      <h2 style="font-weight: 800; margin-bottom: 8px;">অর্ডারটি সফল হয়েছে!</h2>
      <p style="color: var(--muted-text, #666); font-size: 0.9rem;">ধন্যবাদ, আপনার অর্ডারটি সফলভাবে আমাদের সিস্টেমে গ্রহণ করা হয়েছে।</p>
      
      <div class="order-id-box">
        অর্ডার আইডি: <span id="displayOrderId">#FNX-000000</span>
        <button class="copy-btn" onclick="copyOrderId()" title="Copy Order ID"><i class="fa-regular fa-copy"></i></button>
      </div>

      <p style="font-size: 0.82rem; color: var(--muted-text, #777);">
        আমাদের কাস্টমার কেয়ার টিম অতি শীঘ্রই আপনার সাথে কল করে অর্ডারটি কনফার্ম করবে।
      </p>

      <!-- Dynamic Order Summary Breakdown -->
      <div class="order-summary" id="summaryContainer" style="display: none;">
        <div class="summary-title">অর্ডার সামারি</div>
        <div id="summaryItemsList"></div>
        <div class="summary-total">
          <span>সর্বমোট (ডেলিভারি চার্জ সহ):</span>
          <span id="summaryTotal">৳0</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="index.html" class="btn-home"><i class="fa-solid fa-bag-shopping"></i> আরও কেনাকাটা করুন</a>
        <button class="btn-outline-action" onclick="window.print()"><i class="fa-solid fa-print"></i> প্রিন্ট রিসিপ্ট</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">কপি করা হয়েছে!</div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. URL Parameter থেকে Order ID নেওয়া
      const urlParams = new URLSearchParams(window.location.search);
      let orderId = urlParams.get('order_id');

      if (!orderId) {
        orderId = '#FNX-' + Math.floor(100000 + Math.random() * 900000);
      }
      document.getElementById('displayOrderId').innerText = orderId;

      // 2. LocalStorage থেকে শেষ অর্ডারের বিবরণ লোড করা (যদি থাকে)
      const lastOrder = JSON.parse(localStorage.getItem('fenex_last_order'));
      if (lastOrder && lastOrder.items && lastOrder.items.length > 0) {
        const summaryContainer = document.getElementById('summaryContainer');
        const itemsList = document.getElementById('summaryItemsList');
        const totalEl = document.getElementById('summaryTotal');

        summaryContainer.style.display = 'block';
        itemsList.innerHTML = lastOrder.items.map(item => `
          <div class="summary-item">
            <span>${item.name} (${item.size || 'M'}) x ${item.qty}</span>
            <span>৳${item.price * item.qty}</span>
          </div>
        `).join('');

        totalEl.innerText = `৳${lastOrder.totalAmount || 0}`;
      }

      // 3. কার্ট খালি করে দেওয়া
      localStorage.removeItem('cart');
      localStorage.removeItem('fenex_cart');
      if (typeof cart !== 'undefined') {
        cart = [];
        if (typeof updateCartUI === 'function') updateCartUI();
      }
    });

    function copyOrderId() {
      const orderIdText = document.getElementById('displayOrderId').innerText;
      navigator.clipboard.writeText(orderIdText).then(() => {
        if (typeof showToast === 'function') {
          showToast('অর্ডার আইডি কপি করা হয়েছে!');
        } else {
          alert('অর্ডার আইডি কপি করা হয়েছে: ' + orderIdText);
        }
      });
    }
  </script>
</body>
</html>
