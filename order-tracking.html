<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History & Tracking | FENEX</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- html2pdf Library for Invoice Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background: #f4f6f9; color: #111; padding: 20px 5%; }
    .header-title { font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 25px; text-align: center; }
    .tracking-container { max-width: 650px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; outline: none; }
    .btn-search { background: #000; color: #fff; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
    .order-card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 12px; }
    .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-delivered { background: #d4edda; color: #155724; }
    .item-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 0.88rem; }
    .item-img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
    .btn-pdf { background: #20bf6b; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; }
    .btn-pdf:hover { background: #1b9cfc; }
  </style>
</head>
<body>

  <h1 class="header-title">FENEX <span style="font-size:14px; font-weight:normal;">(Order Tracking)</span></h1>

  <div class="tracking-container">
    <h3 style="margin-bottom: 10px; text-align: center;">আপনার অর্ডার ট্র্যাক করুন</h3>
    <p style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 20px;">আপনার মোবাইল নম্বর বা অর্ডার আইডি লিখে সার্চ করুন</p>
    
    <div class="search-box">
      <input type="text" id="searchInput" class="form-control" placeholder="মোবাইল নম্বর অথবা Order ID দিন...">
      <button onclick="searchOrders()" class="btn-search"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
    </div>

    <div id="resultsContainer"></div>
  </div>

  <script>
    let globalOrders = [];

    document.addEventListener("DOMContentLoaded", function() {
      loadCustomerLocalOrders();
    });

    function loadCustomerLocalOrders() {
      try {
        globalOrders = JSON.parse(localStorage.getItem('FENEX_ORDERS')) || JSON.parse(localStorage.getItem('orders')) || [];
        renderOrders(globalOrders);
      } catch (e) {
        console.error(e);
      }
    }

    function searchOrders() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      if (!query) {
        renderOrders(globalOrders);
        return;
      }

      const filtered = globalOrders.filter(function(o) {
        const phone = (o.phone || o.customerPhone || '').toLowerCase();
        const id = (o.id || o.orderId || '').toLowerCase();
        return phone.includes(query) || id.includes(query);
      });

      renderOrders(filtered);
    }

    function renderOrders(orders) {
      const container = document.getElementById('resultsContainer');

      if (!orders || orders.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">কোনো অর্ডারের তথ্য পাওয়া যায়নি!</p>';
        return;
      }

      let html = '';
      orders.forEach(function(order, index) {
        const items = order.items || [];
        const statusClass = order.status === 'Delivered' ? 'status-delivered' : 'status-pending';

        let itemsHtml = '';
        items.forEach(function(i) {
          itemsHtml += `
            <div class="item-row">
              <img src="${i.image || 'https://via.placeholder.com/45'}" class="item-img" onerror="this.src='https://via.placeholder.com/45'">
              <div>
                <strong>${i.name || i.title || 'Product'}</strong><br>
                <small style="color:#666;">Size: ${i.size || 'M'} | Color: ${i.color || 'Standard'} | Qty: ${i.qty || 1}</small>
              </div>
            </div>
          `;
        });

        html += `
          <div class="order-card">
            <div class="order-header">
              <div>
                <strong style="font-size:0.95rem;">Order #${order.id || order.orderId}</strong><br>
                <small style="color:#777;">তারিখ: ${order.date || 'N/A'}</small>
              </div>
              <span class="status-badge ${statusClass}">${order.status || 'Pending'}</span>
            </div>
            
            <div style="margin-bottom:10px;">
              ${itemsHtml}
            </div>

            <div style="border-top: 1px dashed #eee; padding-top: 8px; display:flex; justify-content:space-between; font-size:0.88rem; align-items:center;">
              <div>
                <span>পেমেন্ট: <strong>${order.paymentMethod || 'COD'}</strong></span> | 
                <span>মোট: <strong>৳${order.totalPrice || order.totalAmount || 0}</strong></span>
              </div>
              <button onclick="downloadInvoice(${index})" class="btn-pdf">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // PDF Download Generator Function
    function downloadInvoice(index) {
      const order = globalOrders[index];
      if (!order) return;

      const element = document.createElement('div');
      element.style.padding = '30px';
      element.style.fontFamily = 'Arial, sans-serif';
      element.style.color = '#333';

      let itemsRows = (order.items || []).map(item => `
        <tr>
          <td style="padding: 10px; border-bottom: 1px solid #eee;">${item.name || item.title || 'Product'}</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: center;">${item.qty || 1}</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right;">৳${item.price || 0}</td>
          <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right;">৳${(item.price || 0) * (item.qty || 1)}</td>
        </tr>
      `).join('');

      element.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px;">
          <div>
            <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: 2px;">FENEX</h1>
            <p style="margin: 3px 0 0 0; font-size: 11px; color: #666; text-transform: uppercase;">The Future of Style</p>
          </div>
          <div style="text-align: right;">
            <h2 style="margin: 0; color: #000; font-size: 20px;">INVOICE</h2>
            <p style="margin: 3px 0 0 0; font-size: 12px;"><strong>Order ID:</strong> #${order.id || order.orderId || 'N/A'}</p>
            <p style="margin: 2px 0 0 0; font-size: 12px;"><strong>Date:</strong> ${order.date || new Date().toLocaleDateString()}</p>
          </div>
        </div>

        <div style="margin-bottom: 25px; font-size: 13px; line-height: 1.6; background: #f9f9f9; padding: 12px; border-radius: 6px;">
          <h4 style="margin: 0 0 6px 0; text-transform: uppercase; font-size: 12px; color: #555;">Customer Information:</h4>
          <strong>Name:</strong> ${order.name || order.customerName || 'Customer'}<br>
          <strong>Phone:</strong> ${order.phone || order.customerPhone || 'N/A'}<br>
          <strong>Address:</strong> ${order.address || order.customerAddress || 'N/A'}
        </div>

        <table style="width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 25px;">
          <thead>
            <tr style="background-color: #111; color: #fff; text-align: left;">
              <th style="padding: 10px;">Item Description</th>
              <th style="padding: 10px; text-align: center;">Qty</th>
              <th style="padding: 10px; text-align: right;">Price</th>
              <th style="padding: 10px; text-align: right;">Total</th>
            </tr>
          </thead>
          <tbody>
            ${itemsRows}
          </tbody>
        </table>

        <div style="text-align: right; font-size: 14px; line-height: 1.8;">
          <p style="margin: 0;">Payment Method: <strong>${order.paymentMethod || 'COD'}</strong></p>
          <h3 style="margin: 8px 0 0 0; font-size: 18px; border-top: 2px solid #111; display: inline-block; padding-top: 6px;">
            Grand Total: ৳${order.totalPrice || order.totalAmount || 0}
          </h3>
        </div>

        <div style="margin-top: 50px; text-align: center; border-top: 1px dashed #ccc; padding-top: 15px; font-size: 11px; color: #777;">
          Thank you for shopping with FENEX! For support, contact us through our website.
        </div>
      `;

      const options = {
        margin: 10,
        filename: `FENEX_Invoice_${order.id || order.orderId || 'Order'}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(options).from(element).save();
    }
  </script>
</body>
</html>
